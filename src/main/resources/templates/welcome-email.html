<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        .container {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            border-radius: 8px;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Welcome to Bank, <span th:text="${name}">User</span>!</h2>
    </div>
    <p>Hi <span th:text="${name}">User</span>,</p>
    <p>Thank you for registering with us. Your registered email is:</p>
    <p><strong th:text="${email}">email@example.com</strong></p>
    <p>We're excited to have you onboard!</p>
    <br>
    <p>Best regards,<br/>Team Bank</p>
</div>
</body>
</html>
