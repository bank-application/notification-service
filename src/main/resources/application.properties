# ======================== Basic Configuration ============================
spring.application.name=${APPLICATION_NAME}
server.port=${SERVER_PORT}

commonlib.service.environment=dev
commonlib.service.name=notification-service

# ========================= Monitoring Configuration ==========================
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoint.resilience4j.circuitbreakers.enabled=true

# ============================= OpenAPI basic info ============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ============================= Customize Swagger UI ==========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ================================ OpenApi Metadata ==============================
springdoc.info.title=Auth Service API
springdoc.info.description=API for user authentication and authorization
springdoc.info.version=1.0.0
springdoc.info.contact.name=${SPRING_DOC_CONTACT_NAME}
springdoc.info.contact.email=${SPRING_DOC_CONTACT_EMAIL}
springdoc.info.contact.url=https://your-company.com
springdoc.info.license.name=Apache 2.0
springdoc.info.license.url=https://www.apache.org/licenses/LICENSE-2.0
springdoc.info.external.docs.description=User Service API Documentation
springdoc.info.external.docs.url=https://product-api.wiki.github.org/docs

# ========================= Kafka bootstrap server  =================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVER}

# ====================== Security protocol and SASL mechanism =======================
spring.kafka.properties.security.protocol=${KAFKA_SSL_PROTOCOL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG}
spring.kafka.properties.ssl.truststore.location=$KAFKA_SSL_TRUSTSTORE_LOCATION}
spring.kafka.properties.ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD}

# ============================= Consumer settings ===================================
spring.kafka.consumer.topic.registered.user=${KAFKA_REGISTERED_USER_TOPIC}
spring.kafka.consumer.group.name=${KAFKA_GROUP_NAME}

spring.kafka.consumer.group-id=test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# =============================== Producer settings ==================================
spring.kafka.producer.user.pending.registration.topic=user-pending-registration-topic
spring.kafka.producer.user.success.registration.topic=user-success-registration-topic
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ============================== SMTP Email Configuration ============================
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
# For port 587 ->> STARTTLS and port ->> 465 SSL
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true